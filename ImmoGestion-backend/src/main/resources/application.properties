# ===============================
# APPLICATION
# ===============================
spring.application.name=ImmoGestion
server.port=8003

# ===============================
# R2DBC POSTGRESQL
# ===============================
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/immoGestion
spring.r2dbc.username=postgres
spring.r2dbc.password=Jman07c7!

# Pool de connexions R2DBC
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-acquire-time=3s
spring.r2dbc.pool.max-create-connection-time=3s


# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.example.immogestion=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.postgresql.QUERY=DEBUG
logging.level.io.r2dbc.postgresql.PARAM=DEBUG
